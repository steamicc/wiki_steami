<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 682" width="800" height="682"
     role="img" aria-labelledby="titre desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="titre">Bus I2C1 interne de la STeaMi V1a</title>
  <desc id="desc">Le STM32WB55RG, maître du bus I2C1 (PB8 SCL, PB9 SDA), et les esclaves câblés
    au schéma des indices A et A1, avec leur adresse 7 bits : ISM330DLC 0x6B, LIS2MDL 0x1E,
    VL53L1X 0x29, MCP23009 0x20, BQ27441 0x55, pont DAPLink du STM32F103 0x3B (PB6, PB7), et,
    montage à confirmer, APDS-9960 0x39, WSEN-PADS 0x5D, WSEN-HIDS 0x5F, BME280 0x76 et
    BNO055 0x28. Pull-up R15 et R16 non montées. Interruptions INT_ACC (PC13), INT_MAG (PD1),
    INT_DIST (PB12) et INT_EXPANDER (PB0).</desc>
  <defs>
    <style>
      /* Classes préfixées sch- ; palette du guide de style des schémas. */
      .sch-fond   { fill: #ffffff; stroke: #d0d7de; }
      .sch-bloc   { stroke-width: 1.5; }
      .sch-mcu    { fill: #e0f2f1; stroke: #00796b; }
      .sch-capt   { fill: #fff3e0; stroke: #b35400; }
      .sch-alim   { fill: #ffebee; stroke: #c62828; }
      .sch-ihm    { fill: #e8f5e9; stroke: #2e7d32; }
      .sch-conf   { stroke-dasharray: 5 3; }
      .sch-titre  { font-size: 18px; font-weight: 700; fill: #1f2328; }
      .sch-nom    { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .sch-detail { font-size: 12px; fill: #57606a; }
      .sch-c      { text-anchor: middle; }
      .sch-lien-txt { font-size: 12px; font-weight: 600; }
      .sch-adr    { fill: #00796b; }
      .sch-int    { fill: #57606a; }
      .sch-lien   { fill: none; stroke-width: 2; stroke-linecap: round; }
      .sch-i2c    { stroke: #00796b; stroke-dasharray: 6 4; }
      .sch-gpio   { stroke: #57606a; stroke-width: 1.5; }
    </style>
    <!-- Flèche des interruptions : du capteur vers le STM32WB55. -->
    <marker id="fl-gpio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Fond propre : lisible en thème clair et sombre. -->
  <rect class="sch-fond" x="0.5" y="0.5" width="799" height="681" rx="12"/>
  <text class="sch-titre" x="24" y="40">Bus I2C1 interne : adresses 7 bits et interruptions</text>
  <text class="sch-detail" x="776" y="40" text-anchor="end">STeaMi V1a</text>

  <!-- Maître : STM32WB55RG, broches au bas du bloc. -->
  <rect class="sch-bloc sch-mcu" x="24" y="60" width="752" height="56" rx="6"/>
  <text x="400" y="83" class="sch-c"><tspan class="sch-nom">STM32WB55RG</tspan><tspan class="sch-detail"> · maître du bus I2C1</tspan></text>
  <g class="sch-detail">
    <text x="36" y="106">PB8 SCL, PB9 SDA</text>
    <text class="sch-c" x="168" y="106">PC13</text>
    <text class="sch-c" x="344" y="106">PD1</text>
    <text class="sch-c" x="520" y="106">PB12</text>
    <text class="sch-c" x="696" y="106">PB0</text>
  </g>

  <!-- Bus : tronc vertical à gauche, une branche sous chaque rangée de piquages. -->
  <path class="sch-lien sch-i2c" d="M48 116 V384 H520"/>
  <path class="sch-lien sch-i2c" d="M48 256 H696"/>
  <text class="sch-lien-txt sch-adr" x="60" y="250">I2C1</text>

  <!-- Interruptions : du composant vers le STM32WB55. -->
  <g class="sch-lien sch-gpio">
    <path d="M168 164 V117" marker-end="url(#fl-gpio)"/>
    <path d="M344 164 V117" marker-end="url(#fl-gpio)"/>
    <path d="M520 164 V117" marker-end="url(#fl-gpio)"/>
    <path d="M696 164 V117" marker-end="url(#fl-gpio)"/>
  </g>
  <g class="sch-lien-txt sch-int" text-anchor="end">
    <text x="160" y="145">INT_ACC</text>
    <text x="336" y="145">INT_MAG</text>
    <text x="512" y="145">INT_DIST</text>
    <text x="688" y="145">INT_EXPANDER</text>
  </g>

  <!-- Rangée 1 : composants avec une interruption. -->
  <rect class="sch-bloc sch-capt" x="88" y="164" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="168" y="187">ISM330DLC</text>
  <text class="sch-detail sch-c" x="168" y="207">Accéléromètre, gyroscope</text>

  <rect class="sch-bloc sch-capt" x="264" y="164" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="344" y="187">LIS2MDL</text>
  <text class="sch-detail sch-c" x="344" y="207">Magnétomètre</text>

  <rect class="sch-bloc sch-capt" x="440" y="164" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="520" y="187">VL53L1X</text>
  <text class="sch-detail sch-c" x="520" y="207">Distance (temps de vol)</text>

  <rect class="sch-bloc sch-ihm" x="616" y="164" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="696" y="187">MCP23009</text>
  <text class="sch-detail sch-c" x="696" y="207">Expandeur GPIO</text>

  <!-- Rangée 2 : composants sans interruption vers le STM32WB55. -->
  <rect class="sch-bloc sch-alim" x="88" y="292" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="168" y="315">BQ27441</text>
  <text class="sch-detail sch-c" x="168" y="335">Jauge de batterie</text>

  <rect class="sch-bloc sch-mcu" x="264" y="292" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="344" y="315">STM32F103</text>
  <text class="sch-detail sch-c" x="344" y="335">Pont DAPLink, PB6/PB7</text>

  <rect class="sch-bloc sch-capt sch-conf" x="440" y="292" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="520" y="315">APDS-9960</text>
  <text class="sch-detail sch-c" x="520" y="335">Lumière, couleur, geste</text>

  <rect class="sch-bloc sch-capt sch-conf" x="616" y="292" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="696" y="315">WSEN-PADS</text>
  <text class="sch-detail sch-c" x="696" y="335">Pression</text>

  <!-- Rangée 3 : autres capteurs câblés au schéma. -->
  <rect class="sch-bloc sch-capt sch-conf" x="88" y="420" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="168" y="443">WSEN-HIDS</text>
  <text class="sch-detail sch-c" x="168" y="463">Humidité, température</text>

  <rect class="sch-bloc sch-capt sch-conf" x="264" y="420" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="344" y="443">BME280</text>
  <text class="sch-detail sch-c" x="344" y="463">Pression, humidité, temp.</text>

  <rect class="sch-bloc sch-capt sch-conf" x="440" y="420" width="160" height="56" rx="6"/>
  <text class="sch-nom sch-c" x="520" y="443">BNO055</text>
  <text class="sch-detail sch-c" x="520" y="463">Centrale inertielle 9 axes</text>

  <!-- Piquages sur le bus, avec l'adresse 7 bits à droite du trait. -->
  <g class="sch-lien sch-i2c">
    <path d="M168 220 V256"/>
    <path d="M344 220 V256"/>
    <path d="M520 220 V256"/>
    <path d="M696 220 V256"/>
    <path d="M168 256 V292"/>
    <path d="M344 256 V292"/>
    <path d="M520 256 V292"/>
    <path d="M696 256 V292"/>
    <path d="M168 384 V420"/>
    <path d="M344 384 V420"/>
    <path d="M520 384 V420"/>
  </g>
  <g class="sch-lien-txt sch-adr">
    <text x="176" y="243">0x6B</text>
    <text x="352" y="243">0x1E</text>
    <text x="528" y="243">0x29</text>
    <text x="704" y="243">0x20</text>
    <text x="176" y="279">0x55</text>
    <text x="352" y="279">0x3B</text>
    <text x="528" y="279">0x39</text>
    <text x="704" y="279">0x5D</text>
    <text x="176" y="407">0x5F</text>
    <text x="352" y="407">0x76</text>
    <text x="528" y="407">0x28</text>
  </g>

  <!-- Légende : seulement les types présents, puis les notes. -->
  <rect x="24" y="504" width="752" height="154" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="sch-nom" x="40" y="528">Légende</text>
  <g class="sch-detail">
    <path class="sch-lien sch-i2c" d="M40 550 H80"/><text x="88" y="554">Bus I2C1</text>
    <path class="sch-lien sch-gpio" d="M168 550 H204" marker-end="url(#fl-gpio)"/><text x="212" y="554">Interruption vers le STM32WB55</text>
    <text x="420" y="554"><tspan class="sch-lien-txt sch-adr">0x6B</tspan> adresse 7 bits (× 2 en 8 bits)</text>
    <rect class="sch-bloc sch-mcu" x="40" y="568" width="24" height="16" rx="3"/><text x="72" y="581">MCU</text>
    <rect class="sch-bloc sch-capt" x="128" y="568" width="24" height="16" rx="3"/><text x="160" y="581">Capteur</text>
    <rect class="sch-bloc sch-alim" x="240" y="568" width="24" height="16" rx="3"/><text x="272" y="581">Alimentation</text>
    <rect class="sch-bloc sch-ihm" x="376" y="568" width="24" height="16" rx="3"/><text x="408" y="581">Interface</text>
    <rect class="sch-bloc sch-capt sch-conf" x="488" y="568" width="24" height="16" rx="3"/><text x="520" y="581">Câblé au schéma, montage à confirmer</text>
    <text x="40" y="606">Interruptions de l'APDS-9960, du WSEN-PADS et du WSEN-HIDS : points de test TP32, TP30 et TP31 seulement.</text>
    <text x="40" y="626">BNO055 : partage INT_ACC et INT_MAG avec l'ISM330DLC et le LIS2MDL. BME280 : « ou BME680 » au schéma.</text>
    <text x="40" y="646">Pull-up R15, R16 non montées. PB2 du STM32WB55 : signal I2C_INT, relié à PB2 du STM32F103.</text>
  </g>
</svg>

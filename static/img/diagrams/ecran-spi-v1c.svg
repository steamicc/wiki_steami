<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 732" width="800" height="732"
     role="img" aria-labelledby="titre desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="titre">Écran sur le bus SPI1 (STeaMi V1c)</title>
  <desc id="desc">Câblage de l'écran TFT GC9A01 de la STeaMi V1c : le STM32WB55 pilote l'écran par le bus SPI1 (SCK sur PA1, MOSI sur PB5, CS sur PD0) et par deux GPIO (D/C sur PB4, RST sur PA12), à travers le connecteur FPC 18 positions J7. Le rétroéclairage est relié au +3V3 par R57 et à la masse par R62, sans broche du microcontrôleur ; la sortie TE de l'écran n'est pas reliée.</desc>
  <defs>
    <style>
      .sch-fond { fill: #ffffff; stroke: #d0d7de; }
      .sch-bloc { stroke-width: 1.5; }
      .sch-mcu  { fill: #e0f2f1; stroke: #00796b; }
      .sch-alim { fill: #ffebee; stroke: #c62828; }
      .sch-conn { fill: #f3e5f5; stroke: #7b1fa2; }
      .sch-ihm  { fill: #e8f5e9; stroke: #2e7d32; }
      .sch-ext  { fill: #f6f8fa; stroke: #57606a; }
      .sch-titre  { font-size: 18px; font-weight: 700; fill: #1f2328; }
      .sch-nom    { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .sch-detail { font-size: 12px; fill: #57606a; }
      .sch-broche { font-size: 12px; font-weight: 600; fill: #1f2328; }
      .sch-lien-txt { font-size: 12px; font-weight: 600; }
      .sch-lien { fill: none; stroke-width: 2; stroke-linecap: round; }
      .sch-spi  { stroke: #303f9f; }
      .sch-pwr  { stroke: #c62828; stroke-width: 2.5; }
      .sch-gpio { stroke: #57606a; stroke-width: 1.5; }
      .sch-tp   { fill: #ffffff; stroke-width: 1.5; }
    </style>
    <marker id="fl-pwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c62828"/>
    </marker>
    <marker id="fl-gpio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="sch-fond" x="0.5" y="0.5" width="799" height="731" rx="12"/>
  <text class="sch-titre" x="24" y="40">Écran sur le bus SPI1</text>
  <text class="sch-detail" x="776" y="40" text-anchor="end">STeaMi V1c</text>

  <!-- Blocs de gauche : microcontrôleur, +3V3, masse. -->
  <rect class="sch-bloc sch-mcu" x="24" y="72" width="180" height="288" rx="6"/>
  <text class="sch-nom" x="114" y="96" text-anchor="middle">STM32WB55</text>
  <text class="sch-detail" x="114" y="114" text-anchor="middle">SPI1 (« SPIINT »)</text>
  <g class="sch-broche" text-anchor="end">
    <text x="192" y="144">PD0</text>
    <text x="192" y="184">PA1</text>
    <text x="192" y="224">PB5</text>
    <text x="192" y="264">PB4</text>
    <text x="192" y="344">PA12</text>
  </g>

  <rect class="sch-bloc sch-alim" x="24" y="376" width="180" height="76" rx="6"/>
  <text class="sch-nom" x="114" y="410" text-anchor="middle">+3V3</text>
  <text class="sch-detail" x="114" y="428" text-anchor="middle">rail 3,3 V</text>

  <rect class="sch-bloc sch-ext" x="24" y="468" width="180" height="76" rx="6"/>
  <text class="sch-nom" x="114" y="502" text-anchor="middle">GND</text>
  <text class="sch-detail" x="114" y="520" text-anchor="middle">masse</text>

  <!-- Connecteur J7 et écran. -->
  <rect class="sch-bloc sch-conn" x="496" y="72" width="120" height="472" rx="6"/>
  <text class="sch-nom" x="556" y="96" text-anchor="middle">J7</text>
  <text class="sch-detail" x="556" y="114" text-anchor="middle">FPC 18 pos.</text>
  <g class="sch-broche" text-anchor="middle">
    <text x="556" y="144">10</text>
    <text x="556" y="184">11</text>
    <text x="556" y="224">12</text>
    <text x="556" y="264">13</text>
    <text x="556" y="304">14</text>
    <text x="556" y="344">15</text>
    <text x="556" y="400">16</text>
    <text x="556" y="436">7</text>
    <text x="556" y="488">8</text>
    <text x="556" y="524">9, 18</text>
  </g>

  <rect class="sch-bloc sch-ihm" x="640" y="72" width="136" height="472" rx="6"/>
  <text class="sch-nom" x="708" y="96" text-anchor="middle">Écran GC9A01</text>
  <text class="sch-detail" x="708" y="114" text-anchor="middle">TFT 240 × 240</text>

  <!-- Bus SPI1 : SCK, MOSI, CS. -->
  <path class="sch-lien sch-spi" d="M204 140 H496 M616 140 H640"/>
  <text class="sch-lien-txt" x="216" y="132" fill="#303f9f">CS_OLED</text>
  <path class="sch-lien sch-spi" d="M204 180 H496 M616 180 H640"/>
  <text class="sch-lien-txt" x="216" y="172" fill="#303f9f">SPI1_SCK_OLED</text>
  <path class="sch-lien sch-spi" d="M204 220 H496 M616 220 H640"/>
  <text class="sch-lien-txt" x="216" y="212" fill="#303f9f">SPI1_MOSI_OLED</text>

  <!-- GPIO : D/C, RST ; TE non relié. -->
  <path class="sch-lien sch-gpio" d="M204 260 H496"/>
  <path class="sch-lien sch-gpio" d="M616 260 H640" marker-end="url(#fl-gpio)"/>
  <text class="sch-lien-txt" x="216" y="252" fill="#57606a">D/C_OLED_OR_SPI1_MISO</text>
  <path class="sch-lien sch-gpio" d="M616 300 H640"/>
  <text class="sch-detail" x="484" y="304" text-anchor="end">TE : non relié au MCU</text>
  <path class="sch-lien sch-gpio" d="M204 340 H496"/>
  <path class="sch-lien sch-gpio" d="M616 340 H640" marker-end="url(#fl-gpio)"/>
  <text class="sch-lien-txt" x="216" y="332" fill="#57606a">RST_OLED</text>

  <!-- Points de test. -->
  <g class="sch-detail" text-anchor="middle">
    <circle class="sch-tp" cx="448" cy="140" r="4" stroke="#303f9f"/><text x="448" y="131">TP20</text>
    <circle class="sch-tp" cx="448" cy="180" r="4" stroke="#303f9f"/><text x="448" y="171">TP22</text>
    <circle class="sch-tp" cx="448" cy="220" r="4" stroke="#303f9f"/><text x="448" y="211">TP23</text>
    <circle class="sch-tp" cx="448" cy="260" r="4" stroke="#57606a"/><text x="448" y="251">TP24</text>
    <circle class="sch-tp" cx="448" cy="340" r="4" stroke="#57606a"/><text x="448" y="331">TP21</text>
  </g>

  <!-- Alimentation et rétroéclairage. -->
  <path class="sch-lien sch-pwr" d="M204 396 H496"/>
  <path class="sch-lien sch-pwr" d="M616 396 H640" marker-end="url(#fl-pwr)"/>
  <text class="sch-lien-txt" x="216" y="388" fill="#c62828">+3V3 (alimentation)</text>
  <path class="sch-lien sch-pwr" d="M204 432 H496"/>
  <path class="sch-lien sch-pwr" d="M616 432 H640" marker-end="url(#fl-pwr)"/>
  <text class="sch-lien-txt" x="216" y="424" fill="#c62828">VLED+ par R57</text>
  <path class="sch-lien sch-pwr" d="M204 484 H496 M616 484 H640"/>
  <text class="sch-lien-txt" x="216" y="476" fill="#c62828">VLED− par R62</text>
  <path class="sch-lien sch-pwr" d="M204 520 H496 M616 520 H640"/>
  <text class="sch-lien-txt" x="216" y="512" fill="#c62828">GND</text>

  <!-- Notes. -->
  <text class="sch-detail" x="24" y="572">Rétroéclairage toujours allumé : aucune broche du STM32WB55 ne le commande.</text>
  <text class="sch-detail" x="24" y="592">R57 et R62 sont marquées non montées (NC) dans la nomenclature C : valeur à confirmer sur les cartes.</text>

  <!-- Légende. -->
  <rect x="24" y="612" width="752" height="96" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="sch-nom" x="40" y="636">Légende</text>
  <g class="sch-detail">
    <path class="sch-lien sch-spi" d="M40 662 H80"/><text x="88" y="666">Bus SPI1 : SCK, MOSI, CS</text>
    <path class="sch-lien sch-gpio" d="M290 662 H330" marker-end="url(#fl-gpio)"/><text x="338" y="666">GPIO : D/C, RST, TE</text>
    <path class="sch-lien sch-pwr" d="M530 662 H570" marker-end="url(#fl-pwr)"/><text x="578" y="666">Alimentation, masse</text>
    <circle class="sch-tp" cx="48" cy="690" r="4" stroke="#57606a"/><text x="60" y="694">Point de test</text>
    <rect class="sch-bloc sch-mcu" x="180" y="682" width="24" height="16" rx="3"/><text x="212" y="695">MCU</text>
    <rect class="sch-bloc sch-conn" x="290" y="682" width="24" height="16" rx="3"/><text x="322" y="695">Connecteur</text>
    <rect class="sch-bloc sch-ihm" x="430" y="682" width="24" height="16" rx="3"/><text x="462" y="695">Écran</text>
    <rect class="sch-bloc sch-alim" x="530" y="682" width="24" height="16" rx="3"/><text x="562" y="695">Alimentation</text>
    <rect class="sch-bloc sch-ext" x="670" y="682" width="24" height="16" rx="3"/><text x="702" y="695">Masse</text>
  </g>
</svg>

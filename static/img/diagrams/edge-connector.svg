      .sch-fond { fill: #ffffff; stroke: #d0d7de; }
      .sch-zebre { fill: #f6f8fa; }
      .sch-sep { fill: none; stroke: #d0d7de; stroke-width: 1; }
      .sch-bloc { stroke-width: 1.5; }
      .sch-ana { fill: #fff3e0; stroke: #b35400; }
      .sch-num { fill: #f6f8fa; stroke: #57606a; }
      .sch-spi { fill: #e8eaf6; stroke: #303f9f; }
      .sch-i2c { fill: #e0f2f1; stroke: #00796b; }
      .sch-pwr { fill: #ffebee; stroke: #c62828; }
      .sch-gnd { fill: #424a53; stroke: #1f2328; }
      .sch-pwm { fill: #f3e5f5; stroke: #7b1fa2; }
      .sch-btn { fill: #e8f5e9; stroke: #2e7d32; }
      .sch-trou { fill: #ffffff; stroke-width: 1.5; }
      .sch-titre { font-size: 18px; font-weight: 700; fill: #1f2328; }
      .sch-nom { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .sch-nom-inv { font-size: 14px; font-weight: 600; fill: #ffffff; }
      .sch-mcu-txt { font-size: 14px; fill: #1f2328; }
      .sch-entete { font-size: 12px; font-weight: 600; fill: #57606a; }
      .sch-detail { font-size: 12px; fill: #57606a; }
      .sch-puce-txt { font-size: 12px; font-weight: 600; fill: #1f2328; }
      .sch-puce-inv { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .sch-lien { fill: none; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>


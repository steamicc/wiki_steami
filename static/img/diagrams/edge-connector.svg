<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1012" width="800" height="1012"
     role="img" aria-labelledby="titre desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="titre">Connecteur edge de la STeaMi (V1c)</title>
  <desc id="desc">Les 25 contacts du connecteur edge compatible micro:bit, de gauche à droite sur la face avant : P0 à P20, 3V3 et GND, avec la broche du STM32WB55 et les fonctions de chaque contact. Brochage identique sur V1a, V1b et V1c.</desc>

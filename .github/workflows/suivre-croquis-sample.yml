# =====================================================================
# suivre-croquis-sample.yml : suit les releases du dépôt des croquis
# Arduino du wiki (steamicc/arduino-steami-sample), dont l'archive des
# croquis précompilés est épinglée dans exemples-arduino-sample.json
# (version + sha256). Jumeau de suivre-exemples-arduino.yml, qui suit
# arduino-steami-lib.
#
# Une fois par jour, à la demande et après chaque release du dépôt sample
# (déclenché par steamicc/arduino-steami-sample, une fois l'archive des
# croquis jointe à la release), le workflow lit la dernière release publiée
# du dépôt (ni brouillon ni prerelease : c'est ce que renvoie
# /releases/latest). Si elle est plus récente que la version épinglée, si
# elle contient l'archive steami-exemples-<tag>.zip et qu'aucune PR
# `chore/croquis-sample-<tag>` n'existe (points du tag remplacés par
# des tirets, ex. chore/croquis-sample-v1-2-3, pour respecter la règle
# de .validate-branch-namerc.js), il télécharge l'archive, calcule son
# sha256, met à jour exemples-arduino-sample.json et ouvre la PR. Si la
# branche existe déjà sans PR (ouverture de la PR échouée lors d'une
# exécution précédente), il ouvre seulement la PR sur cette branche. Si la
# PR est déjà ouverte, il vérifie sa fusion automatique ; si elle est en
# conflit avec main (un autre épinglage y a été fusionné entre-temps) et que
# sa branche ne porte que des commits du robot, il refait la branche depuis
# main (épinglage et conversion des croquis), la pousse avec un bail sur
# l'ancienne tête et le signale dans un commentaire de la PR. Une branche
# qui porte un commit ajouté à la main n'est pas refaite : un avertissement
# demande de résoudre le conflit à la main. Seules comptent les PR dont la
# branche est dans ce dépôt (les PR de forks sont ignorées), et la fusion
# automatique n'est activée que pour une PR ouverte par l'App.
#
# Les PR `chore/croquis-sample-*` plus anciennes encore ouvertes, ouvertes
# par l'App dans ce dépôt, sont fermées avec le commentaire « Superseded by
# #n. » une fois la PR de la release la plus récente ouverte ou reprise :
# elles épingleraient une release dépassée et entreraient en conflit. Si la
# release la plus récente est déjà épinglée, elles sont fermées avec
# « Superseded: vX.Y.Z is already pinned. ». Leur branche est supprimée,
# sauf si elle porte un commit ajouté à la main. Rien d'autre n'est fermé.
#
# Conversion des croquis écrits en ligne : dans la même étape, entre
# l'écriture de exemples-arduino-sample.json et le commit, le workflow
# clone arduino-steami-sample au tag de la release dans $RUNNER_TEMP (hors
# du dépôt du wiki, que git add ne voit donc pas), puis lance
# scripts/convertir-croquis.py sur ce clone : chaque bloc `sample=G/N` d'une
# page de docs/ dont examples/G/N/N.ino est dans la release devient
# l'inclusion du croquis (file=) suivie de <EssayerExemple id="G/N"
# source="sample" />, et G/N quitte la liste d'attente
# scripts/exemples-arduino-sample-a-documenter.txt s'il y figurait. Le
# commit d'épinglage emporte aussi ces pages et cette liste, et le corps de
# la PR nomme les croquis convertis. Si un croquis publié diffère du bloc de
# la page (corrigé dans la PR du sample, ou bloc modifié dans le wiki après
# sa fusion, modification que la conversion efface), le corps le nomme et la
# PR est ouverte en brouillon, donc sans fusion automatique, jusqu'à ce
# qu'un humain ait lu le diff et l'ait passée en « Ready for review ».
#
# Croquis nouveaux : ensuite, scripts/completer-attente-arduino.py --source
# sample lit l'index.json de l'archive et ajoute à la liste d'attente chaque
# croquis ni utilisé dans une page (source="sample") ni déjà en attente, pour que
# lint:arduino-examples ne bloque pas la PR ; le corps de la PR les nomme. Les
# croquis retirés ou renommés encore cités restent bloquants.
#
# Tout passe par un jeton d'installation de la GitHub App de l'organisation
# (celle des releases de steamicc/arduino-steami-lib), limité à ce dépôt :
# une PR ouverte avec ce jeton déclenche build.yml (pull_request) sans
# approbation manuelle, contrairement à GITHUB_TOKEN.
#
# Fusion automatique : après l'ouverture, la PR passe en fusion automatique
# (squash) ; GitHub la fusionne dès que le CI est vert. Par sécurité, elle
# n'est activée que si les règles de main exigent la vérification « build »
# (ruleset « CI verte avant fusion ») : sans vérification exigée, GitHub
# fusionnerait tout de suite, même avec un CI rouge. Une PR en brouillon
# n'est pas fusionnée automatiquement.
# Ces contrôles sont ceux de la garde commune .github/scripts/garde-fusion-auto.sh,
# qui refuse aussi un ruleset que le jeton pourrait contourner et relance une
# fois un check exigé rouge, puis fait échouer le run s'il le reste.
#
# Prérequis :
# - secrets RELEASE_APP_ID (identifiant numérique de l'App) et
#   RELEASE_APP_SECRET (clé privée) dans ce dépôt (secret d'organisation
#   autorisé sur steamicc/wiki_steami) ;
# - App installée sur steamicc/wiki_steami, avec Contents, Pull requests
#   et Actions (relance d'un check rouge par la garde) en écriture ;
# - « Allow auto-merge » coché (Settings > General > Pull Requests) ;
# - ruleset sur main exigeant la vérification « build ».
#
# Neutralisé dans les forks.
# =====================================================================
name: suivre-croquis-sample

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# GITHUB_TOKEN ne sert pas : tout passe par le jeton de la GitHub App.
permissions:
  contents: read

# Une seule exécution à la fois : deux lancements simultanés créeraient la même branche.
concurrency:
  group: suivre-croquis-sample
  cancel-in-progress: false

jobs:
  suivre:
    name: nouvelle release des croquis du sample ?
    # Ne pas tourner dans les forks.
    if: github.repository == 'steamicc/wiki_steami'
    runs-on: ubuntu-latest
    steps:
      # Pas de repli sur GITHUB_TOKEN : ses PR attendent une approbation du CI.
      - name: Vérifie les secrets de la GitHub App
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_SECRET: ${{ secrets.RELEASE_APP_SECRET }}
        run: |
          set -euo pipefail
          manquants=()
          [ -n "$APP_ID" ] || manquants+=(RELEASE_APP_ID)
          [ -n "$APP_SECRET" ] || manquants+=(RELEASE_APP_SECRET)
          if [ "${#manquants[@]}" -gt 0 ]; then
            echo "::error::Secret(s) manquant(s) : ${manquants[*]}. Rendre visibles à ce dépôt les secrets d'organisation RELEASE_APP_ID et RELEASE_APP_SECRET de la GitHub App (ceux de steamicc/arduino-steami-lib), ou les ajouter dans ce dépôt (Settings > Secrets and variables > Actions), et installer l'App sur steamicc/wiki_steami."
            exit 1
          fi

      - name: Crée le jeton de la GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Identifiant de l'App (le secret partagé avec arduino-steami-lib).
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          # Jeton limité à ce dépôt.
          owner: ${{ github.repository_owner }}
          repositories: wiki_steami
          permission-contents: write
          permission-pull-requests: write
          # La garde de fusion automatique relance une fois un check exigé rouge.
          permission-actions: write

      - name: Explique l'échec du jeton
        if: failure() && steps.app.outcome == 'failure'
        run: |
          echo "::error::Impossible de créer le jeton de la GitHub App : vérifier que l'App est installée sur steamicc/wiki_steami avec les droits Contents, Pull requests et Actions en écriture, et que RELEASE_APP_ID et RELEASE_APP_SECRET sont ceux de cette App."
          exit 1

      # Le jeton de l'App reste dans .git/config : git ls-remote et git push s'en servent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Compare la dernière release à la version épinglée
        id: comparaison
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          actuel=$(jq -r .version exemples-arduino-sample.json)
          release=$(gh api repos/steamicc/arduino-steami-sample/releases/latest)
          derniere=$(jq -r .tag_name <<<"$release")
          for t in "$actuel" "$derniere"; do
            if ! printf '%s' "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag « $t » invalide : le format attendu est vX.Y.Z"
              exit 1
            fi
          done
          echo "Version épinglée : $actuel ; dernière release du dépôt sample : $derniere"
          # Comparaison de versions (sort -V), pas de chaînes : v0.10.0 > v0.9.0.
          plus_recente=$(printf '%s\n%s\n' "${actuel#v}" "${derniere#v}" | sort -V | tail -n1)
          if [ "$actuel" = "$derniere" ] || [ "v$plus_recente" != "$derniere" ]; then
            echo "Les croquis du sample sont à jour."
            {
              echo "nouvelle=false"
              echo "a_jour=true"
              echo "epinglee=$actuel"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          archive="steami-exemples-$derniere.zip"
          if ! jq -e --arg a "$archive" 'any(.assets[]; .name == $a)' <<<"$release" >/dev/null; then
            echo "::warning::La release $derniere n'a pas (encore) l'archive $archive : rien à faire."
            echo "nouvelle=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Empreinte publiée par GitHub pour l'archive (« sha256:<hex> »), vide si absente.
          empreinte=$(jq -r --arg a "$archive" \
            'first(.assets[] | select(.name == $a)) | .digest // ""' <<<"$release")
          # Points remplacés par des tirets : .validate-branch-namerc.js refuse les points
          # après chore/, et le hook pre-commit bloquerait les commits faits sur la branche.
          branche="chore/croquis-sample-${derniere//./-}"
          # --head filtre sur le seul nom de branche : il trouve aussi les PR venues
          # d'un fork avec une branche du même nom. On ne garde que les PR dont la
          # branche est dans ce dépôt (isCrossRepository faux).
          prs=$(gh pr list --state all --head "$branche" --limit 100 \
            --json number,state,isCrossRepository,author \
            --jq '[.[] | select(.isCrossRepository | not)]')
          # PR déjà ouverte : on vérifie seulement sa fusion automatique, et
          # seulement si c'est le robot qui l'a ouverte (gh écrit app/<slug>).
          ouverte=$(jq -c 'first(.[] | select(.state == "OPEN")) // empty' <<<"$prs")
          if [ -n "$ouverte" ]; then
            pr=$(jq -r .number <<<"$ouverte")
            auteur=$(jq -r .author.login <<<"$ouverte")
            if [ "$auteur" != "app/$APP_SLUG" ] && [ "$auteur" != "${APP_SLUG}[bot]" ]; then
              echo "::warning::La PR #$pr ($branche) a été ouverte par $auteur, pas par le robot : fusion automatique non activée."
              echo "nouvelle=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "La PR #$pr est déjà ouverte pour $branche."
            # PR en conflit avec main (un autre épinglage y a été fusionné
            # entre-temps) : elle ne fusionnerait jamais. GitHub calcule
            # « mergeable » en différé (UNKNOWN juste après un changement de
            # main) : quelques relectures.
            for _ in 1 2 3 4 5 6; do
              vue=$(gh pr view "$pr" --json mergeable,headRefOid)
              mergeable=$(jq -r .mergeable <<<"$vue")
              if [ "$mergeable" != "UNKNOWN" ]; then
                break
              fi
              sleep 5
            done
            reconstruire=false
            if [ "$mergeable" = "CONFLICTING" ]; then
              # Seule une branche faite des seuls commits du robot est refaite :
              # un commit ajouté à la main serait perdu.
              etrangers=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/commits" --paginate \
                | jq -r --arg bot "${APP_SLUG}[bot]" '.[] | select(.author.login != $bot) | .sha')
              if [ -n "$etrangers" ]; then
                echo "::warning::La PR #$pr ($branche) est en conflit avec main et porte des commits qui ne sont pas du robot : résoudre le conflit à la main."
              else
                echo "::warning::La PR #$pr ($branche) est en conflit avec main : sa branche est reconstruite depuis main."
                reconstruire=true
              fi
            fi
            if [ "$reconstruire" = "true" ]; then
              tete=$(jq -r .headRefOid <<<"$vue")
              {
                echo "nouvelle=true"
                echo "pousser=true"
                echo "ouvrir=false"
                echo "reconstruire=true"
                echo "tete=$tete"
                echo "pr=$pr"
                echo "actuel=$actuel"
                echo "derniere=$derniere"
                echo "archive=$archive"
                echo "empreinte=$empreinte"
                echo "branche=$branche"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Vérification de sa fusion automatique."
            {
              echo "nouvelle=true"
              echo "pousser=false"
              echo "ouvrir=false"
              echo "pr=$pr"
              echo "branche=$branche"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR fermée ou fusionnée : on ne recommence pas.
          if [ "$(jq length <<<"$prs")" -gt 0 ]; then
            echo "Une PR fermée ou fusionnée existe déjà pour $branche : rien à faire."
            echo "nouvelle=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branche sans PR : une exécution précédente a poussé la branche, puis
          # l'ouverture de la PR a échoué. On garde la branche et on ouvre la PR.
          pousser=true
          if git ls-remote --exit-code --heads origin "$branche" >/dev/null 2>&1; then
            echo "::warning::La branche $branche existe sans PR : ouverture de la PR sur cette branche."
            pousser=false
          fi
          {
            echo "nouvelle=true"
            echo "pousser=$pousser"
            echo "ouvrir=true"
            echo "actuel=$actuel"
            echo "derniere=$derniere"
            echo "archive=$archive"
            echo "empreinte=$empreinte"
            echo "branche=$branche"
          } >> "$GITHUB_OUTPUT"

      - name: Crée la branche et épingle la nouvelle archive
        id: epinglage
        if: steps.comparaison.outputs.nouvelle == 'true' && steps.comparaison.outputs.pousser == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          DERNIERE: ${{ steps.comparaison.outputs.derniere }}
          ARCHIVE: ${{ steps.comparaison.outputs.archive }}
          EMPREINTE: ${{ steps.comparaison.outputs.empreinte }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
          # PR en conflit : branche refaite depuis main, poussée avec un bail sur TETE.
          RECONSTRUIRE: ${{ steps.comparaison.outputs.reconstruire }}
          TETE: ${{ steps.comparaison.outputs.tete }}
        run: |
          set -euo pipefail
          # L'archive n'est pas décompressée ici : seuls son sha256 et son index.json servent.
          dl="$RUNNER_TEMP/croquis-sample"
          mkdir -p "$dl"
          curl -fL --retry 3 --silent --show-error -o "$dl/$ARCHIVE" \
            "https://github.com/steamicc/arduino-steami-sample/releases/download/$DERNIERE/$ARCHIVE"
          sha=$(sha256sum "$dl/$ARCHIVE" | cut -d' ' -f1)
          echo "sha256 de $ARCHIVE : $sha"
          # Si GitHub publie une empreinte pour l'archive, elle doit correspondre au fichier reçu.
          if [ -n "$EMPREINTE" ] && [ "$EMPREINTE" != "sha256:$sha" ]; then
            echo "::error::sha256 différent de l'empreinte publiée par GitHub ($EMPREINTE)"
            exit 1
          fi
          # Même forme que le fichier actuel (indentation 2, saut de ligne final) : Prettier l'accepte.
          jq -n --arg v "$DERNIERE" --arg s "$sha" '{version: $v, sha256: $s}' > exemples-arduino-sample.json
          # Croquis écrits en ligne publiés par cette release : remplacés dans les pages
          # par leur inclusion et le bouton Téléverser. Sources au tag clonées hors du
          # dépôt du wiki ; le dépôt sample est public, aucun jeton n'est nécessaire.
          src="$RUNNER_TEMP/arduino-steami-sample"
          git clone --depth 1 --quiet --branch "$DERNIERE" https://github.com/steamicc/arduino-steami-sample.git "$src"
          python3 scripts/convertir-croquis.py "$src" --sortie-github "$GITHUB_OUTPUT"
          # Nouveaux croquis de l'index, ni utilisés dans une page (source="sample") ni
          # en attente : ajoutés à scripts/exemples-arduino-sample-a-documenter.txt
          # (sortie « ajoutes », citée dans la PR), sinon lint:arduino-examples
          # bloquerait la PR. Après la conversion, qui retire de la liste les croquis
          # désormais utilisés. Un croquis retiré ou renommé encore cité reste
          # bloquant : à corriger à la main.
          unzip -p "$dl/$ARCHIVE" index.json > "$dl/index.json"
          python3 scripts/completer-attente-arduino.py --source sample --index "$dl/index.json" \
            --sortie-github "$GITHUB_OUTPUT"
          # Commit au nom du compte robot de l'App (<slug>[bot]).
          bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCHE"
          git add exemples-arduino-sample.json docs scripts/exemples-arduino-sample-a-documenter.txt
          git commit -m "chore(configs): croquis du sample $DERNIERE"
          if [ "$RECONSTRUIRE" = "true" ]; then
            # Le bail refuse la poussée si la branche a changé depuis la lecture de la PR.
            git push --force-with-lease="refs/heads/$BRANCHE:$TETE" origin "$BRANCHE"
          else
            git push origin "$BRANCHE"
          fi

      - name: Ouvre la PR
        id: ouverture
        if: steps.comparaison.outputs.nouvelle == 'true' && steps.comparaison.outputs.ouvrir == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTUEL: ${{ steps.comparaison.outputs.actuel }}
          DERNIERE: ${{ steps.comparaison.outputs.derniere }}
          ARCHIVE: ${{ steps.comparaison.outputs.archive }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
          POUSSE: ${{ steps.comparaison.outputs.pousser }}
          # Vides si la branche existait déjà (conversion faite lors d'une exécution précédente).
          CONVERTIS: ${{ steps.epinglage.outputs.convertis }}
          DIFFERENTS: ${{ steps.epinglage.outputs.differents }}
          AJOUTES: ${{ steps.epinglage.outputs.ajoutes }}
        run: |
          set -euo pipefail
          conversion=""
          ecarts=""
          attente=""
          if [ -n "$AJOUTES" ]; then
            read -ra ids <<<"$AJOUTES"
            liste=$(printf "\`%s\`, " "${ids[@]}")
            attente="Les nouveaux croquis de cette release, qui ne sont ni utilisés dans une page ni en attente, sont ajoutés à \`scripts/exemples-arduino-sample-a-documenter.txt\` : ${liste%, }. Ils restent à documenter plus tard : écrire leur section dans une page Arduino du wiki (bloc \`\` \`\`\`cpp file=.external/arduino-steami-sample/examples/G/N/N.ino \`\` suivi de \`<EssayerExemple id=\"G/N\" source=\"sample\" />\`) et retirer leur ligne de la liste."
          fi
          brouillon=()
          if [ -n "$CONVERTIS" ]; then
            read -ra ids <<<"$CONVERTIS"
            liste=$(printf "\`%s\`, " "${ids[@]}")
            conversion="Elle remplace aussi chaque croquis écrit en ligne dans une page du wiki, marqué \`sample=G/N\` et publié par cette release (${liste%, }), par son inclusion depuis le sample (bloc \`\` \`\`\`cpp file=.external/arduino-steami-sample/examples/G/N/N.ino \`\`) suivie du bouton \`<EssayerExemple id=\"G/N\" source=\"sample\" />\`, et le retire de \`scripts/exemples-arduino-sample-a-documenter.txt\` s'il y figurait (\`scripts/convertir-croquis.py\`). Le croquis affiché est désormais celui de la release : vérifier le diff des pages."
          fi
          # Croquis publié différent du bloc de la page : correction voulue dans la
          # PR du sample, ou modification faite dans le wiki après sa fusion, que
          # la conversion efface. Un humain tranche : PR en brouillon, donc sans
          # fusion automatique (l'étape suivante la saute tant qu'elle l'est).
          if [ -n "$DIFFERENTS" ]; then
            read -ra ids <<<"$DIFFERENTS"
            liste=$(printf "\`%s\`, " "${ids[@]}")
            ecarts="**À vérifier avant de fusionner :** pour ${liste%, }, le croquis publié diffère du bloc qui était dans la page. Soit il a été corrigé dans la PR d'arduino-steami-sample (rien à faire), soit le bloc a été modifié dans le wiki après la fusion de cette PR, soit un autre croquis porte déjà ce nom : la page affiche maintenant le croquis publié et la modification du wiki est perdue. Lire le diff de chaque page et reporter dans arduino-steami-sample une modification à garder. La PR est ouverte en brouillon : la passer en « Ready for review » une fois vérifiée, et le robot active la fusion automatique à son passage suivant."
            brouillon=(--draft)
          elif [ "$POUSSE" != "true" ]; then
            # Branche poussée par une exécution précédente : les écarts éventuels
            # de sa conversion ne sont plus connus.
            ecarts="**À vérifier avant de fusionner :** la branche a été préparée par une exécution précédente du robot, qui n'a pas pu ouvrir la PR : les croquis convertis, les croquis ajoutés à \`scripts/exemples-arduino-sample-a-documenter.txt\` et les écarts éventuels avec les pages ne sont plus connus (le diff les montre). Lire le diff des pages, puis passer la PR en « Ready for review » : le robot active la fusion automatique à son passage suivant."
            brouillon=(--draft)
          fi
          if [ "${#brouillon[@]}" -gt 0 ]; then
            fusion="La fusion automatique (squash) n'est pas activée tant que la PR est en brouillon. Une fois la PR passée en « Ready for review », le robot l'active à son passage suivant : la PR est alors fusionnée dès que le CI est vert."
          else
            fusion="La fusion automatique (squash) est activée : la PR est fusionnée dès que le CI est vert, y compris après des commits ajoutés sur la branche. Pour l'éviter, passer la PR en brouillon : désactiver seulement la fusion automatique ne suffit pas, le robot la réactive à son passage suivant."
          fi
          corps="$RUNNER_TEMP/corps.md"
          cat > "$corps" <<EOT
          Le dépôt des croquis Arduino du wiki a une nouvelle release : \`$DERNIERE\` (le wiki épingle \`$ACTUEL\`).
          https://github.com/steamicc/arduino-steami-sample/releases/tag/$DERNIERE

          Cette PR met à jour \`exemples-arduino-sample.json\` : la version et le sha256 de l'archive \`$ARCHIVE\`, calculé sur le fichier de la release.

          $conversion

          $ecarts

          $attente

          La vérification \`lint:arduino-examples\` (build.yml) signale encore les croquis retirés ou renommés encore cités dans une page (\`<EssayerExemple id=... source="sample" />\`) ou dans la liste d'attente : corriger la page ou la liste sur cette branche avant de fusionner. Dans ce cas, le build échoue aussi (fichier \`.ino\` introuvable) ; la vérification tourne quand même et nomme les croquis en cause.

          $fusion
          EOT
          url=$(gh pr create --base main --head "$BRANCHE" "${brouillon[@]}" \
            --title "chore(configs): croquis du sample $DERNIERE" \
            --body-file "$corps")
          echo "PR ouverte : $url"
          echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"

      # PR en conflit reconstruite depuis main : un commentaire le dit sur la PR.
      # La conversion des croquis a été refaite : si un croquis publié diffère
      # maintenant du bloc de sa page, la PR repasse en brouillon (sans fusion
      # automatique) jusqu'à ce qu'un humain ait lu le diff.
      - name: Signale la reconstruction de la branche
        if: steps.comparaison.outputs.reconstruire == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.comparaison.outputs.pr }}
          DIFFERENTS: ${{ steps.epinglage.outputs.differents }}
          AJOUTES: ${{ steps.epinglage.outputs.ajoutes }}
        run: |
          set -euo pipefail
          corps="Branche reconstruite depuis main par le robot : la PR était en conflit avec main (un autre épinglage y a été fusionné entre-temps). La conversion des croquis écrits en ligne a été refaite sur main."
          if [ -n "$AJOUTES" ]; then
            read -ra ids <<<"$AJOUTES"
            liste=$(printf "\`%s\`, " "${ids[@]}")
            corps+=" Croquis ajoutés à \`scripts/exemples-arduino-sample-a-documenter.txt\` : ${liste%, }."
          fi
          if [ -n "$DIFFERENTS" ]; then
            read -ra ids <<<"$DIFFERENTS"
            liste=$(printf "\`%s\`, " "${ids[@]}")
            etat=$(gh pr view "$PR" --json isDraft,autoMergeRequest)
            if jq -e '.autoMergeRequest != null' <<<"$etat" >/dev/null; then
              gh pr merge "$PR" --disable-auto
            fi
            if ! jq -e .isDraft <<<"$etat" >/dev/null; then
              gh pr ready "$PR" --undo
            fi
            corps+=$'\n\n'"**À vérifier avant de fusionner :** pour ${liste%, }, le croquis publié diffère du bloc qui était dans la page : lire le diff de chaque page et reporter dans arduino-steami-sample une modification à garder. La PR repasse en brouillon : la passer en « Ready for review » une fois vérifiée, et le robot active la fusion automatique à son passage suivant."
          fi
          gh pr comment "$PR" --body "$corps"

      # Une PR d'une release plus ancienne épinglerait une archive dépassée et
      # entrerait en conflit avec celle-ci. Seules les PR de l'App, dans ce
      # dépôt, et dont la branche est chore/croquis-sample-*, sont fermées.
      # Une branche qui porte des commits ajoutés à la main (pages du wiki) est
      # gardée.
      - name: Ferme les PR des releases dépassées
        if: steps.comparaison.outputs.nouvelle == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ steps.ouverture.outputs.pr || steps.comparaison.outputs.pr }}
          BRANCHE: ${{ steps.comparaison.outputs.branche }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Numéro de PR introuvable (« $PR »)"
            exit 1
          fi
          # Pas de --author (index de recherche en retard) : filtre sur l'auteur en jq.
          anciennes=$(gh pr list --state open --limit 200 \
            --json number,headRefName,isCrossRepository,author \
            | jq -r --arg branche "$BRANCHE" --arg a1 "app/$APP_SLUG" --arg a2 "${APP_SLUG}[bot]" \
              '.[] | select((.isCrossRepository | not)
                and (.headRefName | startswith("chore/croquis-sample-"))
                and .headRefName != $branche
                and (.author.login == $a1 or .author.login == $a2)) | .number')
          for n in $anciennes; do
            etrangers=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n/commits" --paginate \
              | jq -r --arg bot "${APP_SLUG}[bot]" '.[] | select(.author.login != $bot) | .sha')
            if [ -z "$etrangers" ]; then
              echo "Fermeture de la PR #$n (release dépassée)."
              gh pr close "$n" --delete-branch --comment "Superseded by #$PR."
            else
              echo "::warning::Fermeture de la PR #$n (release dépassée) : sa branche porte des commits ajoutés à la main, elle est gardée."
              gh pr close "$n" --comment "Superseded by #$PR. The branch is kept: it has commits not made by the robot."
            fi
          done

      # Release la plus récente déjà épinglée : toute PR du robot encore ouverte
      # est dépassée.
      - name: Ferme les PR des releases dépassées (release déjà épinglée)
        if: steps.comparaison.outputs.a_jour == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          EPINGLEE: ${{ steps.comparaison.outputs.epinglee }}
        run: |
          set -euo pipefail
          anciennes=$(gh pr list --state open --limit 200 \
            --json number,headRefName,isCrossRepository,author \
            | jq -r --arg a1 "app/$APP_SLUG" --arg a2 "${APP_SLUG}[bot]" \
              '.[] | select((.isCrossRepository | not)
                and (.headRefName | startswith("chore/croquis-sample-"))
                and (.author.login == $a1 or .author.login == $a2)) | .number')
          for n in $anciennes; do
            etrangers=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n/commits" --paginate \
              | jq -r --arg bot "${APP_SLUG}[bot]" '.[] | select(.author.login != $bot) | .sha')
            if [ -z "$etrangers" ]; then
              echo "Fermeture de la PR #$n (release dépassée)."
              gh pr close "$n" --delete-branch --comment "Superseded: $EPINGLEE is already pinned."
            else
              echo "::warning::Fermeture de la PR #$n (release dépassée) : sa branche porte des commits ajoutés à la main, elle est gardée."
              gh pr close "$n" --comment "Superseded: $EPINGLEE is already pinned. The branch is kept: it has commits not made by the robot."
            fi
          done

      # Garde commune .github/scripts/garde-fusion-auto.sh (copiée à l'identique
      # dans chaque dépôt steamicc qui a un robot) : PR ouverte par le robot dans
      # ce dépôt, check « build » exigé sur sa branche par défaut sans contournement
      # possible, ni brouillon ni étiquette « garder-ouverte », puis fusion
      # automatique (squash). Si elle est déjà activée et qu'un check exigé est
      # rouge, la garde le relance une fois, puis fait échouer le run du robot.
      - name: Active la fusion automatique
        if: steps.comparaison.outputs.nouvelle == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ steps.ouverture.outputs.pr || steps.comparaison.outputs.pr }}
        run: bash .github/scripts/garde-fusion-auto.sh "$GITHUB_REPOSITORY" "$PR" "$APP_SLUG" build
